<mat-form-field class="ng-smart-input__container">
	@if (label()) {
	<mat-label class="ng-smart-input__label">{{ label() }}</mat-label>
	}

	<input
		matInput
		[type]="type()"
		[formControl]="formControl"
		class="ng-smart-input__input"
		[placeholder]="placeholder()"
		[attr.autocomplete]="autocomplete()"
	/>

	<mat-error class="ng-smart-input__error" [title]="errorText()">
		{{ errorText() }}
	</mat-error>
</mat-form-field>
