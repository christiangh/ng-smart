<mat-form-field class="ng-smart-input__container">
    @if(computedLabel()) {
    <mat-label class="ng-smart-input__label">{{ computedLabel() }}</mat-label>
    }

    <input
        matInput
        [type]="type() || 'text'"
        [formControl]="formControl"
        class="ng-smart-input__input"
        [placeholder]="placeholder()"
        [attr.autocomplete]="autocomplete() ? autocomplete() : null" />

    <mat-error class="ng-smart-input__error" [title]="errorText()">
        {{ errorText() }}
    </mat-error>
</mat-form-field>
